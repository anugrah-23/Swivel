# Every push and pull request: build and test.
# Every push to main: also pack the installer as a dry run (kept as a build artifact for 14 days).
# A v* tag: pack, make sure Swivel's engine mirror exists (engines-v1, with their source code), then
# publish a GitHub Release, which is also Swivel's update feed (Velopack reads releases.win.json).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache engines
        uses: actions/cache@v4
        with:
          path: engines
          key: engines-${{ hashFiles('build/engines.lock.json', 'build/fetch-engines.ps1') }}

      - name: Fetch pinned engines
        shell: pwsh
        run: ./build/fetch-engines.ps1

      - name: Build
        run: dotnet build Swivel.sln -c Release

      # UI tests need an interactive desktop and Office tests need Office; both run locally.
      - name: Test
        run: >
          dotnet test Swivel.sln -c Release --no-build
          --filter "Category!=Perf&FullyQualifiedName!~Swivel.UiTests"

  pack:
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          else {
            $base = ([xml](Get-Content src/Swivel.App/Swivel.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-ci.${{ github.run_number }}"
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Pack installer
        shell: pwsh
        run: ./build/pack.ps1 -Version '${{ steps.version.outputs.value }}'

      # Code signing (SignPath Foundation's free OSS programme) slots in here once approved: sign
      # Swivel.exe, Swivel.ShellExt.dll and a Swivel.Shell.msix before vpk pack runs.

      - name: Keep the dry-run installer
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Swivel-${{ steps.version.outputs.value }}-Setup
          path: artifacts/releases/Swivel-win-Setup.exe
          retention-days: 14

      # Upstream engine builds get deleted, so Swivel keeps its own verified copies, plus the exact
      # source code of each (FFmpeg and 7-Zip are LGPL, Pandoc is GPL), on a release of their own.
      - name: Mirror engines and their sources
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = 'engines-v1'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'Engine mirror' --latest=false `
              --notes 'Pinned copies of the engines Swivel ships or downloads (SHA-256 in build/engines.lock.json), with their source code. Not an app release.'
          }
          $have = gh release view $tag --json assets --jq '.assets[].name'
          $sources = @{
            'ffmpeg-46d899d7a02bc63237472cc4897258d5ddf274ac-source.tar.gz' = 'https://github.com/FFmpeg/FFmpeg/archive/46d899d7a02bc63237472cc4897258d5ddf274ac.tar.gz'
            'pandoc-3.12.1-source.tar.gz' = 'https://github.com/jgm/pandoc/archive/refs/tags/3.12.1.tar.gz'
            '7z2604-src.tar.xz' = 'https://www.7-zip.org/a/7z2604-src.tar.xz'
          }
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'mirror')
          foreach ($name in $sources.Keys) {
            if ($have -notcontains $name) { Invoke-WebRequest $sources[$name] -OutFile (Join-Path $dir $name) }
          }
          Get-ChildItem (Join-Path $env:TEMP 'swivel-engine-cache') -File | Where-Object { $have -notcontains $_.Name } | Copy-Item -Destination $dir
          $files = Get-ChildItem $dir -File
          if ($files) { gh release upload $tag $files.FullName }

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: >
          dotnet tool restore;
          dotnet vpk upload github --outputDir artifacts/releases
          --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --releaseName "Swivel ${{ github.ref_name }}" --tag "${{ github.ref_name }}" --publish
