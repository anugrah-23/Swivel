# Build and test on every push and pull request; on a v* tag, also pack the installer and publish a
# GitHub Release that doubles as Swivel's update feed (Velopack reads releases.win.json from it).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache engines
        uses: actions/cache@v4
        with:
          path: engines
          key: engines-${{ hashFiles('build/engines.lock.json', 'build/fetch-engines.ps1') }}

      - name: Fetch pinned engines
        shell: pwsh
        run: ./build/fetch-engines.ps1

      - name: Build
        run: dotnet build Swivel.sln -c Release

      # UI tests need an interactive desktop and Office tests need Office; both skip or are left
      # out here and run locally. Perf tests run locally against real hardware.
      - name: Test
        run: >
          dotnet test Swivel.sln -c Release --no-build
          --filter "Category!=Perf&FullyQualifiedName!~Swivel.UiTests"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack installer
        shell: pwsh
        run: ./build/pack.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      # Code signing (SignPath Foundation's free OSS programme) slots in here once approved: sign
      # Swivel.exe, Swivel.ShellExt.dll and Swivel.Shell.msix before vpk pack runs.

      - name: Publish GitHub Release
        shell: pwsh
        run: >
          dotnet tool restore;
          dotnet vpk upload github --outputDir artifacts/releases
          --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --releaseName "Swivel ${{ github.ref_name }}" --tag "${{ github.ref_name }}" --publish
